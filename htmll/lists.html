<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <ul>
        <li>mango</li>
        <li>apple</li>
    </ul>
    <hr>
    <br>
    <ol>
        <li>apple</li>
        <li>mango</li>
    </ol>

<hr><br>
    <!--sublists-->
    <ol>
        <li>apple</li>
        <ul>
            <li>
                color:red
        </li>
        <li>season:winters</li>
     </ul>
     <li>mango</li>
     <ul>
        <li>color:yellow</li>
        <li>season:summers</li>

     </ul>
    </ol>
</body>
</html>
